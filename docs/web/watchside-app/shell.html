<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <!--
      No analytics, no tracking, no external scripts, no external fonts, no
      cookies. Everything each page needs is in that page. The domain existing
      is not a reason to start measuring visitors.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #101014;
        --surface: #17171d;
        --text: #efeff1;
        --dim: #a6a6b0;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #ff8452;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 48px 24px 96px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      main { max-width: 46rem; margin: 0 auto; }

      .back {
        display: inline-block;
        margin-bottom: 28px;
        color: var(--dim);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .back:hover { color: var(--text); }

      h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.02em; }
      h2 { margin: 36px 0 12px; font-size: 1.3rem; letter-spacing: -0.01em; }
      h3 { margin: 24px 0 8px; font-size: 1.05rem; }

      p { margin: 0 0 16px; }
      ul { margin: 0 0 16px; padding-left: 1.4em; }
      li { margin-bottom: 8px; }

      strong { color: #fff; }

      a { color: var(--accent); }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 3px;
      }

      .lede { font-size: 1.15rem; color: var(--text); margin-bottom: 28px; }
      .dim { color: var(--dim); }

      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .mark svg { flex: none; }
      .wordmark {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .cta {
        display: inline-block;
        margin: 8px 0 12px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--accent);
        color: #14100d;
        font-weight: 700;
        text-decoration: none;
      }
      .cta:hover { filter: brightness(1.08); }

      .card {
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        margin-bottom: 20px;
      }

      footer {
        margin-top: 56px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 0.9rem;
      }
      footer a { margin-right: 18px; }

      @media (max-width: 640px) {
        body { padding: 32px 16px 64px; }
        h1 { font-size: 1.6rem; }
      }
    </style>
  </head>
  <body>
    <main>
{{BODY}}
    </main>
  </body>
</html>
