<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#0b0b0e" />
    <!--
      The mark, inline. An external icon file would be the one request these
      pages otherwise never make, and it is 400 bytes.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%230B0B0E'/%3E%3Cpath d='M40 102 H92 a20 20 0 0 0 20-20 V42 a20 20 0 0 0-20-20 H36 a20 20 0 0 0-20 20 v40 a20 20 0 0 0 20 20 h2 v14 z' fill='none' stroke='%23A855F7' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M42 66 L50 86 L64 72 L78 86 L86 66' fill='none' stroke='%23A855F7' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='49' r='6' fill='%23A855F7'/%3E%3Ccircle cx='80' cy='49' r='6' fill='%23A855F7'/%3E%3C/svg%3E"
    />
    <!--
      No analytics, no tracking, no external scripts, no external fonts, no
      cookies. Everything each page needs is in that page. The domain existing
      is not a reason to start measuring visitors.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0e;
        --surface: #131318;
        --text: #f5f5f7;
        --dim: #9c9ca8;
        --line: #26262f;
        --accent: #a855f7;
        /* The deeper end of the brand purple, for gradients and hovers. */
        --accent-deep: #9333ea;
        --accent-soft: rgba(168, 85, 247, 0.12);
      }

      /* Nobody should be ambushed by motion they did not ask for. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 48px 24px 96px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      main { max-width: 46rem; margin: 0 auto; }

      .back {
        display: inline-block;
        margin-bottom: 28px;
        color: var(--dim);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .back:hover { color: var(--text); }

      h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.02em; }
      h2 { margin: 36px 0 12px; font-size: 1.3rem; letter-spacing: -0.01em; }
      h3 { margin: 24px 0 8px; font-size: 1.05rem; }

      p { margin: 0 0 16px; }
      ul { margin: 0 0 16px; padding-left: 1.4em; }
      li { margin-bottom: 8px; }

      strong { color: #fff; }

      a { color: var(--accent); }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 3px;
      }

      .lede { font-size: 1.15rem; color: var(--text); margin-bottom: 28px; }
      .dim { color: var(--dim); }

      .mark {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .mark svg { flex: none; }
      .wordmark {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .cta {
        display: inline-block;
        margin: 8px 0 12px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--accent);
        color: #1a1a21;
        font-weight: 700;
        text-decoration: none;
      }
      .cta:hover { filter: brightness(1.08); }

      /* The second choice beside a primary one: same shape, less weight. */
      .cta-alt {
        margin-left: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--text);
      }
      .cta-alt:hover { border-color: var(--accent); background: var(--accent-soft); }

      @media (max-width: 480px) {
        .cta, .cta-alt { display: block; margin-left: 0; text-align: center; }
      }

      .card {
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        margin-bottom: 20px;
      }

      footer {
        margin-top: 56px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 0.9rem;
      }
      footer a { margin-right: 18px; }

      @media (max-width: 640px) {
        body { padding: 32px 16px 64px; }
        h1 { font-size: 1.6rem; }
      }
    </style>
{{HEAD}}
  </head>
  <body>
    <main>
{{BODY}}
    </main>
  </body>
</html>
