<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kickback</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 248px;
        margin: 0;
        padding: 16px;
        background: #151519;
        color: #efeff1;
        font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .wordmark {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(100deg, #ff8452, #ff4f8b);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 12px;
        color: #a6a6b0;
      }
      a.cta {
        display: block;
        padding: 9px 12px;
        border-radius: 9px;
        text-align: center;
        text-decoration: none;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #1a0d06;
        background: linear-gradient(100deg, #ff8452, #ff4f8b);
      }
      .note {
        margin: 12px 0 0;
        font-size: 11px;
        color: #74747f;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <img src="icons/icon-32.png" width="22" height="22" alt="" />
      <span class="wordmark">kickback</span>
    </div>
    <p>Kickback lives inside Twitch. Open any Twitch page and sign in from the panel in the top right.</p>
    <a class="cta" href="https://www.twitch.tv/" target="_blank" rel="noreferrer">OPEN TWITCH</a>
    <p class="note">Phase 1 — sign in with Twitch. Friends and presence are still being built.</p>
  </body>
</html>
