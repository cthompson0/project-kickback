<link rel="stylesheet" href="kickback.css">
<div class="kb-root" style="width:320px">
  <div class="kb-account">
    <button type="button" class="kb-ghost-btn">Reset layout</button>
    <button type="button" class="kb-ghost-btn">Feedback</button>
    <a class="kb-ghost-btn kb-ghost-link" href="#">Support</a>
    <button type="button" class="kb-ghost-btn">Sign out</button>
  </div>
</div>
<pre id="out">pending</pre>
<script>
window.addEventListener('load', function () {
  var lines = []
  var box = document.querySelector('.kb-account').getBoundingClientRect()
  document.querySelectorAll('.kb-ghost-btn').forEach(function (el) {
    var r = document.createRange()
    r.selectNodeContents(el)
    var t = r.getBoundingClientRect()
    var e = el.getBoundingClientRect()
    lines.push(
      el.textContent.trim().padEnd(14) +
      ' display=' + getComputedStyle(el).display.padEnd(11) +
      ' box=[' + e.left.toFixed(1) + ',' + e.right.toFixed(1) + ']' +
      ' text=[' + t.left.toFixed(1) + ',' + t.right.toFixed(1) + ']' +
      ' textCentre=' + ((t.left + t.right) / 2).toFixed(1) +
      ' boxCentre=' + ((e.left + e.right) / 2).toFixed(1) +
      ' offBy=' + (((t.left + t.right) / 2) - ((e.left + e.right) / 2)).toFixed(1)
    )
  })
  document.getElementById('out').textContent = lines.join('\n')
})
</script>
